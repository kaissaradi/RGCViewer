[pytest]
testpaths = tests

# Registering the marks turns "Unknown pytest.mark" warnings into working
# selectors, so the heavy suites can be excluded by name:
#   pytest -m "not performance and not stress"   # the fast pass
#   pytest -m performance                        # timings only
markers =
    performance: timing or throughput measurement; slow and machine-dependent
    profiling: collects a profile rather than asserting behaviour
    slow: takes more than a few seconds
    stress: drives the GUI or the caches with a large synthetic dataset
    visual: compares rendered output (needs pytest-mpl baselines)
