name: Deploy Lean Production to Main

on:
  push:
    branches:
      - dev-testing  # Runs automatically whenever you push here

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Sync to Main without Dev Files
        run: |
          # Switch to main branch
          git checkout main
          
          # Force main to match dev-testing content temporarily
          git reset --hard origin/dev-testing
          
          # Explicitly purge the dev/testing files from main
          git rm -rf docs/ tests/ .benchmarks/ .pytest_cache/ conftest.py test_population_panel.py pytest.ini requirements-dev.txt --ignore-unmatch
          
          # Commit the clean state and push back to main
          git commit -m "chore: automated smart production sync" || echo "No changes to commit"
          git push origin main --force