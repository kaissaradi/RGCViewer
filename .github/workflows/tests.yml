# Unit suite on every push and pull request (PLAN.md Q27).
# Python 3.10 and 3.13 bracket what install.sh accepts. Tests that need the
# lab mount (/mnt/lab), Java or Vision.jar skip themselves.
name: tests

on:
  push:
    branches: [main, dev-testing]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libdbus-1-3
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Unit tests
        # -rs lists every skip and why (e.g. no pwsh for the install.ps1 tests).
        run: |
          pwsh --version || echo 'no pwsh on this runner'
          python -m pytest tests/unit -q -rs
